map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy all API requests to the backend server. Must come before the static
    # asset cache location: regex locations win on first match, and proxied
    # preview paths (e.g. /global/preview/proxy/<port>/.../app.js) end in asset
    # extensions that would otherwise be served (404) from disk instead.
    location ~ ^/(global|session|file|project(?!s)|provider|path|config|question|permission|pty|mcp|sync|tui|preview|auth|api|agent|command|doc|event|experimental|find|formatter|instance|log|lsp|skill|vcs)($|/) {
        proxy_pass http://127.0.0.1:4096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Use x-forwarded-proto from upstream proxy (Cloudflare) if available,
        # otherwise fall back to $scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
